<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3ec" />
    <meta name="description" content="استكشف غرف Staywise وأرسل طلب حجز إقامتك." />
    <title>Staywise | احجز إقامتك</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="guest.css?v=3" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Staywise"><span class="brand-mark">S</span><span>staywise</span></a>
      <nav aria-label="التنقل الرئيسي"><a class="nav-cta" href="#booking">الحجز</a></nav>
    </header>
    <main id="top">
      <section class="rooms section-wrap" id="rooms" aria-labelledby="rooms-title">
        <div class="section-heading"><div><h1 id="rooms-title">صور الغرف</h1></div></div>
        <div class="gallery">
          <article class="gallery-card" role="button" tabindex="0" aria-label="تكبير صورة الجناح الفاخر"><img src="https://images.unsplash.com/photo-1776761363365-ad83248b93df?auto=format&fit=crop&w=1400&q=85" alt="جناح فندقي فاخر بإطلالة على المدينة" fetchpriority="high" /><div class="gallery-caption"><span>01</span><strong>جناح فاخر</strong><span class="zoom-mark" aria-hidden="true">＋</span></div></article>
          <article class="gallery-card" role="button" tabindex="0" aria-label="تكبير صورة غرفة الديلوكس"><img src="https://images.unsplash.com/photo-1790419683322-b08a7050c424?auto=format&fit=crop&w=1100&q=85" alt="غرفة فندقية أنيقة بجدار حجري وتفاصيل خشبية" loading="lazy" /><div class="gallery-caption"><span>02</span><strong>غرفة ديلوكس</strong><span class="zoom-mark" aria-hidden="true">＋</span></div></article>
          <article class="gallery-card" role="button" tabindex="0" aria-label="تكبير صورة غرفة البريميوم"><img src="https://images.unsplash.com/photo-1731336478850-6bce7235e320?auto=format&fit=crop&w=1100&q=85" alt="غرفة فندقية فاخرة بسرير مريح ولمسات عصرية" loading="lazy" /><div class="gallery-caption"><span>03</span><strong>غرفة بريميوم</strong><span class="zoom-mark" aria-hidden="true">＋</span></div></article>
          <article class="gallery-card" role="button" tabindex="0" aria-label="تكبير صورة الغرفة الهادئة"><img src="https://images.unsplash.com/photo-1652161854125-1f5289c13eac?auto=format&fit=crop&w=1100&q=85" alt="غرفة فندقية هادئة بإضاءة طبيعية وألوان راقية" loading="lazy" /><div class="gallery-caption"><span>04</span><strong>غرفة هادئة</strong><span class="zoom-mark" aria-hidden="true">＋</span></div></article>
        </div>
        <p class="photo-note">الصور لأغراض العرض، وقد تختلف الغرفة الفعلية عنها. الصور: <a href="https://unsplash.com/license" target="_blank" rel="noreferrer">Unsplash</a>.</p>
      </section>
      <section class="booking section-wrap" id="booking" aria-labelledby="booking-title">
        <div class="booking-intro"><h2 id="booking-title">الحجز</h2><p>اختر تواريخ إقامتك والغرفة المناسبة لإرسال طلب الحجز.</p><div class="booking-note"><span class="note-mark">✦</span><span>يتم تأكيد الحجز بعد مراجعة الطلب من فريق الفندق.</span></div></div>
        <form id="booking-form" class="booking-form">
          <div class="field-row"><label>تاريخ الوصول<input name="check_in" id="check-in" type="date" required /></label><label>تاريخ المغادرة<input name="check_out" id="check-out" type="date" required /></label></div>
          <div class="field-row field-row-small"><label>البالغون<select name="adults"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>الأطفال<select name="children"><option selected>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label><button id="search-rooms" class="button button-outline" type="button">عرض الغرف المتاحة <span>←</span></button></div>
          <div id="availability" class="availability" aria-live="polite"></div>
          <div id="guest-fields" class="guest-fields" hidden>
            <label>الاسم الكامل<input name="name" autocomplete="name" maxlength="120" required placeholder="الاسم الأول واسم العائلة" /></label>
            <div class="field-row"><label>البريد الإلكتروني<input name="email" type="email" autocomplete="email" maxlength="254" required /></label><label>رقم الهاتف<input name="phone" type="tel" autocomplete="tel" maxlength="32" required /></label></div>
            <label class="honeypot" aria-hidden="true">اترك هذا الحقل فارغًا<input name="website" tabindex="-1" autocomplete="off" /></label>
            <button id="submit-booking" class="button button-dark button-full" type="submit" disabled>إرسال طلب الحجز <span>←</span></button>
          </div>
          <p id="booking-message" class="booking-message" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <dialog id="photo-dialog" class="photo-dialog" aria-label="معرض صور الغرف">
      <button class="photo-close" type="button" aria-label="إغلاق الصورة">×</button>
      <button class="photo-arrow photo-prev" type="button" aria-label="الصورة السابقة">›</button>
      <figure><img id="dialog-image" alt="" /><figcaption><strong id="dialog-title"></strong><span id="dialog-count"></span></figcaption></figure>
      <button class="photo-arrow photo-next" type="button" aria-label="الصورة التالية">‹</button>
    </dialog>
    <script src="guest.js?v=3" defer></script>
  </body>
</html>
